name: Nightly Build

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  # Nightly is an optimized production profile, not a development tooling build.
  GOWORK: "off"
  GOFLAGS: ""
  GO_MODFILE: ""
  # Publish a compatible plugin-sdk and update go.mod before releasing; no local fallback.
  SDK_SOURCE: ""
  WAILS_MCP: ""
  EXTRA_TAGS: ""
  RELEASE: "true"
  HOMEBREW_TAP: mononendev/homebrew-tap

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Version for this build. The job keeps its upstream name; every push to `release` builds.
  # ─────────────────────────────────────────────────────────────────────────────
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      nightly_version: ${{ steps.check.outputs.nightly_version }}
    steps:
      - name: Compute version
        id: check
        shell: bash
        run: |
          # The run number keeps versions unique and increasing when several builds land on one day.
          NIGHTLY_VERSION="0.0.0-nightly.$(date -u +%Y%m%d).${{ github.run_number }}"
          echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS (darwin/arm64, file name kept as "universal") — ad-hoc sign, DMG
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - name: Install dependencies and global TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm add --global typescript

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stock host module
        shell: bash
        run: |
          set -eu
          HOST_MODFILE="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD")"
          printf 'GO_MODFILE=%s\n' "$HOST_MODFILE" >> "$GITHUB_ENV"

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build frontend
        shell: bash
        run: task common:build:frontend RELEASE=true DEV=false BUILD_FLAGS='-tags production'

      - name: Build Omniview
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-mmacosx-version-min=10.15"
          CGO_LDFLAGS: "-mmacosx-version-min=10.15"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          go build -modfile="$GO_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ needs.check-changes.outputs.nightly_version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=true \
              -X github.com/omniviewdev/omniview/internal/instance.buildChannel=nightly \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ vars.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/appstate.buildStateDir=~/.omniview-nightly" \
            -o bin/Omniview .

      - name: Create macOS .app bundle
        run: |
          task common:generate:icons
          mkdir -p bin/Omniview.app/Contents/MacOS
          mkdir -p bin/Omniview.app/Contents/Resources
          cp build/darwin/icons.icns bin/Omniview.app/Contents/Resources/
          cp bin/Omniview bin/Omniview.app/Contents/MacOS/
          cp build/darwin/Info.plist bin/Omniview.app/Contents/

      # No Developer ID in this fork: ad-hoc sign. The Homebrew cask strips the quarantine attribute.
      - name: Ad-hoc sign
        shell: bash
        run: codesign --deep --force --sign - bin/Omniview.app

      - name: Checkout create-dmg
        uses: actions/checkout@v4
        with:
          repository: create-dmg/create-dmg
          path: ./build/create-dmg
          ref: master

      - name: Create DMG
        shell: bash
        working-directory: ./build
        run: |
          VERSION="${{ needs.check-changes.outputs.nightly_version }}"
          ../build/create-dmg/create-dmg \
            --no-internet-enable \
            --volname "Omniview Nightly" \
            --text-size 12 \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon-size 80 \
            --icon "Omniview.app" 180 180 \
            --hide-extension "Omniview.app" \
            --app-drop-link 480 180 \
            "../bin/Omniview_${VERSION}_darwin_universal.dmg" \
            "../bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-macos-dmg
          path: bin/Omniview_${{ needs.check-changes.outputs.nightly_version }}_darwin_universal.dmg
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux (linux/amd64)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ${{ vars.SELF_HOSTED_LINUX_RUNNER != '' && fromJSON(vars.SELF_HOSTED_LINUX_RUNNER) || 'ubuntu-latest' }}
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # awalsh128/cache-apt-pkgs-action@latest restores an empty package set here, so install directly.
      - name: Install Linux dependencies
        run: |
          # Self-hosted runners may already have these; skip apt (and sudo) when they do.
          if command -v gcc >/dev/null && pkg-config --exists gtk4 webkitgtk-6.0 wayland-client 2>/dev/null; then
            echo "GTK4, webkitgtk-6.0 and wayland already installed"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - name: Install dependencies and global TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm add --global typescript

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stock host module
        shell: bash
        run: |
          set -eu
          HOST_MODFILE="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD")"
          printf 'GO_MODFILE=%s\n' "$HOST_MODFILE" >> "$GITHUB_ENV"

      - name: Install Wails v3
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build frontend
        run: task common:build:frontend RELEASE=true DEV=false BUILD_FLAGS='-tags production'

      - name: Build Omniview
        run: |
          go build -modfile="$GO_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ needs.check-changes.outputs.nightly_version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=true \
              -X github.com/omniviewdev/omniview/internal/instance.buildChannel=nightly \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ vars.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/appstate.buildStateDir=~/.omniview-nightly" \
            -o bin/Omniview .

      - name: Rename executable
        working-directory: ./bin
        run: mv Omniview "Omniview_${{ needs.check-changes.outputs.nightly_version }}_linux_amd64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-linux-binary
          path: bin/Omniview_${{ needs.check-changes.outputs.nightly_version }}_linux_amd64
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows (windows/amd64)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - name: Install dependencies and global TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm add --global typescript

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stock host module
        shell: bash
        run: |
          set -eu
          HOST_MODFILE="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD")"
          printf 'GO_MODFILE=%s\n' "$HOST_MODFILE" >> "$GITHUB_ENV"

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build frontend
        shell: bash
        run: task common:build:frontend RELEASE=true DEV=false BUILD_FLAGS='-tags production'

      - name: Build Omniview
        shell: bash
        run: |
          go build -modfile="$GO_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s -H windowsgui \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ needs.check-changes.outputs.nightly_version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=true \
              -X github.com/omniviewdev/omniview/internal/instance.buildChannel=nightly \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ vars.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/appstate.buildStateDir=~/.omniview-nightly" \
            -o bin/Omniview.exe .

      - name: Rename executable
        working-directory: ./bin
        run: Rename-Item -Path "Omniview.exe" -NewName "Omniview_${{ needs.check-changes.outputs.nightly_version }}_windows_amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows-binary
          path: bin/Omniview_${{ needs.check-changes.outputs.nightly_version }}_windows_amd64.exe
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish nightly — rolling tag
  # ─────────────────────────────────────────────────────────────────────────────
  publish-nightly:
    runs-on: ubuntu-latest
    needs: [check-changes, build-macos, build-linux, build-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/nightly-macos-dmg/*.dmg release/
          cp artifacts/nightly-linux-binary/* release/
          cp artifacts/nightly-windows-binary/*.exe release/

      - name: Generate checksums
        shell: bash
        working-directory: release
        run: sha256sum * > checksums_sha256.txt

      - name: Delete previous nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (${{ needs.check-changes.outputs.nightly_version }})"
          body: |
            Automated build of the `release` branch.

            **Version**: `${{ needs.check-changes.outputs.nightly_version }}`
            **Commit**: ${{ github.sha }}

            > These builds are for testing purposes and may be unstable.
            >
            > Install via Homebrew: `brew install --cask mononendev/tap/omniview@nightly`
          files: release/*
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Nightly Cask
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY not set, skipping Homebrew nightly update"
            exit 0
          fi

          VERSION="${{ needs.check-changes.outputs.nightly_version }}"
          DMG_FILE="release/Omniview_${VERSION}_darwin_universal.dmg"
          SHA256=$(sha256sum "$DMG_FILE" | awk '{print $1}')

          install -m 600 /dev/null "$RUNNER_TEMP/tap_key"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone "git@github.com:${HOMEBREW_TAP}.git" tap
          cd tap

          CASK="Casks/omniview@nightly.rb"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$CASK"
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$CASK"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update omniview@nightly to ${VERSION}"
          git push
