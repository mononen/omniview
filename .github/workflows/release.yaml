name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  PNPM_VERSION: "10"
  HOMEBREW_TAP: mononendev/homebrew-tap

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # macOS (darwin/arm64, file name kept as "universal") — ad-hoc sign, DMG
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: |
            - args: []
            - args: [--global, typescript]

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)

      - name: Build frontend
        shell: bash
        run: task common:build:frontend

      - name: Build Omniview
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-mmacosx-version-min=10.15"
          CGO_LDFLAGS: "-mmacosx-version-min=10.15"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          go build -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=false \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ vars.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }}" \
            -o bin/Omniview .

      - name: Create macOS .app bundle
        run: |
          task common:generate:icons
          mkdir -p bin/Omniview.app/Contents/MacOS
          mkdir -p bin/Omniview.app/Contents/Resources
          cp build/darwin/icons.icns bin/Omniview.app/Contents/Resources/
          cp bin/Omniview bin/Omniview.app/Contents/MacOS/
          cp build/darwin/Info.plist bin/Omniview.app/Contents/

      # No Developer ID in this fork: ad-hoc sign. The Homebrew cask strips the quarantine attribute.
      - name: Ad-hoc sign
        shell: bash
        run: codesign --deep --force --sign - bin/Omniview.app

      - name: Checkout create-dmg
        uses: actions/checkout@v4
        with:
          repository: create-dmg/create-dmg
          path: ./build/create-dmg
          ref: master

      - name: Create DMG
        shell: bash
        working-directory: ./build
        run: |
          ../build/create-dmg/create-dmg \
            --no-internet-enable \
            --volname "Omniview" \
            --text-size 12 \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon-size 80 \
            --icon "Omniview.app" 180 180 \
            --hide-extension "Omniview.app" \
            --app-drop-link 480 180 \
            "../bin/Omniview_${{ steps.version.outputs.version }}_darwin_universal.dmg" \
            "../bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: bin/Omniview_${{ steps.version.outputs.version }}_darwin_universal.dmg
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux (linux/amd64)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # awalsh128/cache-apt-pkgs-action@latest restores an empty package set here, so install directly.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libwayland-dev build-essential pkg-config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: |
            - args: []
            - args: [--global, typescript]

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)

      - name: Build frontend
        run: task common:build:frontend

      - name: Build Omniview
        run: |
          go build -tags "production,webkit2_41" -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=false \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ vars.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }}" \
            -o bin/Omniview .

      - name: Rename executable
        working-directory: ./bin
        run: mv Omniview "Omniview_${{ steps.version.outputs.version }}_linux_amd64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/Omniview_${{ steps.version.outputs.version }}_linux_amd64
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows (windows/amd64)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: |
            - args: []
            - args: [--global, typescript]

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)

      - name: Build frontend
        shell: bash
        run: task common:build:frontend

      - name: Build Omniview
        shell: bash
        run: |
          go build -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s -H windowsgui \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=false \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ vars.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }}" \
            -o bin/Omniview.exe .

      - name: Rename executable
        working-directory: ./bin
        run: Rename-Item -Path "Omniview.exe" -NewName "Omniview_${{ steps.version.outputs.version }}_windows_amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: bin/Omniview_${{ steps.version.outputs.version }}_windows_amd64.exe
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish — download all artifacts, checksums, GitHub Release, Homebrew
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/macos-dmg/*.dmg release/
          cp artifacts/linux-binary/* release/
          cp artifacts/windows-binary/*.exe release/

      - name: Generate checksums
        shell: bash
        working-directory: release
        run: sha256sum * > checksums_sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY not set, skipping Homebrew update"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"
          DMG_FILE="release/Omniview_${VERSION}_darwin_universal.dmg"
          SHA256=$(sha256sum "$DMG_FILE" | awk '{print $1}')

          install -m 600 /dev/null "$RUNNER_TEMP/tap_key"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone "git@github.com:${HOMEBREW_TAP}.git" tap
          cd tap

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/omniview.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/omniview.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/omniview.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update omniview to ${VERSION}"
          git push
